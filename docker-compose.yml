version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: convrolabs-app
    volumes:
      - ./src:/var/www/src
      - ./config:/var/www/config
      - ./public:/var/www/public
      - ./data:/var/www/data
    environment:
      - APP_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - convrolabs

  web:
    image: nginx:alpine
    container_name: convrolabs-web
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/public
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - convrolabs

  certbot:
    image: certbot/certbot
    container_name: convrolabs-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - convrolabs

networks:
  convrolabs:
    driver: bridge
