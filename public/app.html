<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConvroLabs - Secure Dev Toolkit</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/neon.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="icon" type="image/png" href="https://images.squarespace-cdn.com/content/v1/5ffe234606e5ec7bfc57a7a3/d9fe2ace-2d17-4886-a2e4-794fe080164c/Pen+Test+Icon%404x.png?format=32w">
</head>
<body>
    <canvas id="particles-bg"></canvas>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <div class="login-logo">
                <img src="https://images.squarespace-cdn.com/content/v1/5ffe234606e5ec7bfc57a7a3/d9fe2ace-2d17-4886-a2e4-794fe080164c/Pen+Test+Icon%404x.png?format=500w" alt="ConvroLabs" class="logo-img">
            </div>
            <h1 class="login-title glitch-text" data-text="ConvroLabs">ConvroLabs</h1>
            <p class="login-subtitle">Secure Developer Toolkit</p>
            <form id="login-form" class="login-form" autocomplete="off">
                <div class="input-group neon-border">
                    <label for="password-input">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    </label>
                    <input type="password" id="password-input" placeholder="Enter password" required>
                </div>
                <div id="login-error" class="error-msg"></div>
                <button type="submit" class="btn btn-primary btn-glow">
                    <span class="btn-text">Authenticate</span>
                    <span class="btn-loader"></span>
                </button>
            </form>
            <div class="login-footer">
                <span class="blink-dot"></span> Encrypted &amp; Secure
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen" class="screen">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <img src="https://images.squarespace-cdn.com/content/v1/5ffe234606e5ec7bfc57a7a3/d9fe2ace-2d17-4886-a2e4-794fe080164c/Pen+Test+Icon%404x.png?format=100w" alt="Logo" class="sidebar-logo">
                <span class="sidebar-brand">ConvroLabs</span>
            </div>
            <ul class="nav-links">
                <li><a href="#dashboard" class="nav-link active" data-view="dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    Dashboard
                </a></li>
                <li><a href="#links" class="nav-link" data-view="links">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                    Short Links
                </a></li>
                <li><a href="#files" class="nav-link" data-view="files">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    File CDN
                </a></li>
                <li><a href="#obfuscator" class="nav-link" data-view="obfuscator">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/><line x1="14" y1="4" x2="10" y2="20"/></svg>
                    Obfuscator
                </a></li>
                <li><a href="#snippets" class="nav-link" data-view="snippets">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    Snippets
                </a></li>
                <li><a href="#tools" class="nav-link" data-view="tools">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
                    Dev Tools
                </a></li>
            </ul>
            <div class="sidebar-footer">
                <button id="logout-btn" class="btn btn-ghost btn-sm">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Logout
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <div id="view-container"></div>
        </main>
    </div>

    <!-- Toast notification container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/assets/js/effects.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/dashboard.js"></script>
    <script src="/assets/js/links.js"></script>
    <script src="/assets/js/files.js"></script>
    <script src="/assets/js/obfuscator.js"></script>
    <script src="/assets/js/tools.js"></script>
</body>
</html>
